<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Voice Express Stand</title>
<meta name="description" content="The Voice Express reading room - every gazette, broadsheet, booklet and magazine, free to read and yours to keep.">
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#15110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice Express">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<noscript>
  <style>
    #ns-notice{max-width:38em;margin:3.5rem auto;padding:1.5rem 1.75rem;font-family:Georgia,'Playfair Display',serif;
      background:#faf6ee;color:#15110c;border:1px solid #15110c;line-height:1.5}
    #ns-notice h1{font-size:1.15rem;margin:0 0 .6rem}
    #ns-notice a{color:#15110c}
  </style>
  <div id="ns-notice">
    <h1>The reading room needs JavaScript</h1>
    <p>This is a shelf that turns pages, remembers your place and keeps a library in your browser
      &mdash; none of which works with scripts switched off. Turn JavaScript back on for this site
      to browse the stand, or read us at <a href="https://thevoiceexpress.in">thevoiceexpress.in</a>,
      where every piece also lives as a plain page.</p>
  </div>
</noscript>
<div class="beta-banner" id="beta-banner" role="status">
  <span class="beta-tag">Beta mode</span>
  <span class="beta-text">This stand is still being built. Something broken or wrong?</span>
  <a class="beta-link" id="beta-report" href="mailto:thevoiceexpress@proton.me?subject=Error%20report%3A%20The%20Voice%20Express%20Stand">Report an error</a>
  <button class="beta-x" id="beta-x" type="button" title="Dismiss" aria-label="Dismiss">&times;</button>
</div>

<header class="head" id="head">
  <div class="head-in">
    <a class="brand" href="#/" data-go>
      <img class="brand-logo" id="brand-logo" src="logo.png" alt="">
      <span class="brand-txt">The Voice Express <em>Stand</em></span>
    </a>
    <div class="head-search" role="search">
      <svg class="search-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <label class="sr-only" for="search">Search the stand</label>
      <input id="search" type="search" placeholder="Search titles, authors, tags, years&hellip;" autocomplete="off">
    </div>
    <div class="head-acct" id="acct"></div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<main id="app" class="app"></main>
<p id="live" class="sr-only" role="status" aria-live="polite"></p>

<footer class="foot"><span id="foot-meta"></span></footer>

<div id="reader" class="reader" hidden>
  <div class="rd-bar">
    <button class="rd-back" id="rd-back" aria-label="Back to the shelf">&#8592;</button>
    <div class="rd-meta"><span id="rd-type" class="rd-type"></span><span id="rd-title" class="rd-title"></span></div>
    <div class="rd-tools">
      <div class="rd-themes" id="rd-themes" role="group" aria-label="Reading theme">
        <button data-theme="paper" class="on" title="Paper" aria-label="Paper theme">A</button>
        <button data-theme="sepia" title="Sepia" aria-label="Sepia theme">A</button>
        <button data-theme="night" title="Night" aria-label="Night theme">A</button>
      </div>
      <div class="rd-size rd-themes" id="rd-size" role="group" aria-label="Text size">
        <button data-size="s" title="Small text" aria-label="Small text">S</button>
        <button data-size="m" class="on" title="Medium text" aria-label="Medium text">M</button>
        <button data-size="l" title="Large text" aria-label="Large text">L</button>
      </div>
      <button class="rd-act" id="rd-save" title="Save to library">&#9734;</button>
      <button class="rd-act" id="rd-dl" title="Download">&#8595;</button>
      <button class="rd-act rd-support" id="rd-support" title="Support this work">&#9825;</button>
    </div>
  </div>
  <div class="rd-prog"><span id="rd-progbar"></span></div>
  <div class="rd-stage" id="rd-stage"></div>
  <form id="rd-annot" class="rd-annot" hidden>
    <blockquote id="rd-annot-q" class="rd-annot-q"></blockquote>
    <textarea id="rd-annot-note" class="rd-annot-note" rows="2" maxlength="600"
      placeholder="Note in the margin&hellip;" aria-label="Your margin note"></textarea>
    <div class="rd-annot-bar">
      <button type="submit" id="rd-annot-go" class="btn-dl">Keep note</button>
      <button type="button" id="rd-annot-x" class="btn-ghost">Cancel</button>
      <span id="rd-annot-status" class="rd-annot-status">Kept on this device. Share it later if you want to.</span>
    </div>
  </form>
</div>


<div id="pay" class="modal" hidden>
  <div class="modal-card sm" role="dialog" aria-modal="true" aria-labelledby="pay-title">
    <button class="modal-x" id="pay-x" aria-label="Close">&times;</button>
    <div class="pay-body">
      <div class="pay-head">
        <h2 id="pay-title">Support the work</h2>
        <p id="pay-sub" class="pay-sub">Name your price, then scan or tap.</p>
      </div>
      <div class="pwyw">
        <label class="pwyw-l" for="p-amt">Name your price</label>
        <div class="amount"><span id="p-cur" class="cur"></span><input id="p-amt" class="amt" type="number" min="0" step="10" value="0"></div>
        <div class="chips" id="p-chips"></div>
      </div>
      <div class="pay-rails" id="pay-rails"></div>
      <div class="pay-foot">
        <button id="pay-hearts" class="btn-ghost">&#9825; Pay in hearts (free)</button>
      </div>
    </div>
  </div>
</div>

<div id="msg" class="modal" hidden>
  <div class="modal-card sm" role="dialog" aria-modal="true">
    <button class="modal-x" id="msg-x" aria-label="Close">&times;</button>
    <div class="acct-body">
      <h2 class="pay-title">Send a cute message</h2>
      <p class="acct-note">Goes straight to the inbox.</p>
      <input id="msg-from" class="acct-user" placeholder="your name or handle (optional)" maxlength="60">
      <textarea id="msg-body" class="acct-user msg-area" placeholder="say hi&hellip;" maxlength="600"></textarea>
      <button id="msg-go" class="btn-dl">Send &#9825;</button>
      <p class="acct-msg" id="msg-status"></p>
    </div>
  </div>
</div>

<div id="acctmodal" class="modal" hidden>
  <div class="modal-card sm" role="dialog" aria-modal="true">
    <button class="modal-x" id="acct-x" aria-label="Close">&times;</button>
    <div class="acct-body">
      <div class="acct-tabs">
        <button id="tab-in" class="atab on">Sign in</button>
        <button id="tab-up" class="atab">Create account</button>
      </div>
      <p class="acct-note" id="acct-note">No password &mdash; just a handle.</p>
      <input id="acct-user" class="acct-user" placeholder="your handle" autocomplete="off" maxlength="40">
      <button id="acct-go" class="btn-dl">Continue</button>
      <p class="acct-msg" id="acct-msg"></p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="qr.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var b=document.getElementById('beta-banner');
  if(!b)return;
  try{if(sessionStorage.getItem('ve-beta-hidden')==='1'){b.remove();return;}}catch(e){}
  var r=document.getElementById('beta-report');
  if(r)r.href=r.href+'&body='+encodeURIComponent('Page: '+location.href+'

What went wrong:
');
  var x=document.getElementById('beta-x');
  if(x)x.addEventListener('click',function(){b.remove();try{sessionStorage.setItem('ve-beta-hidden','1');}catch(e){}});
})();
</script>
</body>
</html>
